services:
  # 1. PWA Backend (UAT - builds from source on EC2)
  backend-pwa:
    build:
      context: ./hurshbintech-backend
      dockerfile: Dockerfile
      args:
        - SECURE_BUILD=false
    container_name: hurshbintech-backend-pwa
    # Map host port 8001 -> Container port 8000
    ports:
      - "8001:8000"
    env_file:
      - ./hurshbintech-backend/.env.production
    environment:
      - DATABASE_URL=postgresql://hurshbinuser:hurshbintech@db-pwa:5432/hurshbintechdb_pwa
      - ENVIRONMENT=production
      - REDIS_ENABLED=true
      - REDIS_HOST=redis-pwa
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=Password12#$
    volumes:
      - ~/certs:/app/certs:ro
    depends_on:
      redis-pwa:
        condition: service_healthy
      db-pwa:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --ssl-keyfile /app/certs/key.pem --ssl-certfile /app/certs/cert.pem
    restart: unless-stopped
    networks:
      - pwa-network

  # 2. PWA Frontend (UAT - builds from source on EC2, port 3001)
  frontend-pwa:
    build:
      context: ./hurshbintech-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://hurshbin.lumesoftai.in:8001/api
        - VITE_WS_URL=wss://hurshbin.lumesoftai.in:8001
        - ENVIRONMENT=production
        - VITE_ENABLE_PWA=true
        - VITE_GOOGLE_CLIENT_ID=594243784455-qehgec7ij9lqnvo38jumb5m29ttv4gck.apps.googleusercontent.com
        - ENV_TYPE=uat
    container_name: hurshbintech-frontend-pwa
    # Map host port 3001 -> Container port 3000
    ports:
      - "3001:3000"
    volumes:
      - ~/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - pwa-network

  # 3. PWA Database
  db-pwa:
    image: postgres:15
    container_name: hurshbintech-db-pwa
    environment:
      POSTGRES_USER: hurshbinuser
      POSTGRES_PASSWORD: hurshbintech
      POSTGRES_DB: hurshbintechdb_pwa
    volumes:
      - pwa_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pwa-network

  # 4. Redis Cache (file-mounted config)
  redis-pwa:
    image: redis:7-alpine
    container_name: hurshbintech-redis-pwa
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_pwa_data:/data
    ports:
      - "6379:6379"
    networks:
      - pwa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 320M
        reservations:
          cpus: '0.25'
          memory: 128M

  # 5. TURN Server for WebRTC (UAT - EC2)
  coturn:
    image: coturn/coturn:latest
    container_name: hurshbintech-coturn
    restart: unless-stopped
    network_mode: "host"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --realm=hurshbin.lumesoftai.in
      - --user=hurshbin:SecureTurnPass2024!
      - --lt-cred-mech
      - --fingerprint
      - --external-ip=43.204.218.16
      - --listening-port=3478

volumes:
  pwa_postgres_data:
  redis_pwa_data:

networks:
  pwa-network:
    driver: bridge
