services:
  backend:
    build:
      context: ./hurshbintech-backend
      dockerfile: Dockerfile
    container_name: hurshbintech-backend
    network_mode: "host"
    env_file:
      - ./hurshbintech-backend/.env.production
    environment:
      - DATABASE_URL=postgresql://hurshbinuser:hurshbintech@localhost:5432/hurshbintechdb
      - ENVIRONMENT=production
    volumes:
      - ~/certs:/app/certs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./hurshbintech-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://43.204.218.16:8000/api
        - VITE_WS_URL=wss://43.204.218.16:8000
        - ENVIRONMENT=production
    container_name: hurshbintech-frontend
    network_mode: "host"
    volumes:
      - ~/certs:/app/certs:ro
    restart: unless-stopped

  # ✅ TURN Server for WebRTC (Fixes video connections behind NAT)
  coturn:
    image: coturn/coturn:latest
    container_name: hurshbintech-coturn
    restart: unless-stopped
    network_mode: "host"
    command: 
      - -n 
      - --log-file=stdout 
      - --min-port=49152 
      - --max-port=65535 
      - --realm=hurshbin.lumesoftai.in
      - --user=hurshbin:SecureTurnPass2024!
      - --lt-cred-mech 
      - --fingerprint 
      - --external-ip=43.204.218.16
      - --listening-port=3478