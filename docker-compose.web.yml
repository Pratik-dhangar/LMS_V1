services:
  backend:
    build:
      context: ./hurshbintech-backend
      dockerfile: Dockerfile
    container_name: hurshbintech-backend
    ports:
      - "8000:8000"
    env_file:
      - ./hurshbintech-backend/.env.production
    environment:
      - DATABASE_URL=postgresql://hurshbinuser:hurshbintech@localhost:5432/hurshbintechdb
      - ENVIRONMENT=production
      # Redis Configuration (Docker service)
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ~/certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web-network

  frontend:
    build:
      context: ./hurshbintech-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://43.204.218.16:8000/api
        - VITE_WS_URL=wss://43.204.218.16:8000
        - ENVIRONMENT=production
    container_name: hurshbintech-frontend
    ports:
      - "3000:3000"
    volumes:
      - ~/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - web-network

  # Redis Cache (256MB limit with LRU eviction)
  redis:
    image: redis:7-alpine
    container_name: hurshbintech-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"  # Expose for monitoring (optional, can be removed in production)
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Memory and CPU limits (prevents resource exhaustion)
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Max 50% of one CPU core
          memory: 320M       # 256MB for Redis + 64MB overhead
        reservations:
          cpus: '0.25'
          memory: 128M

  # ✅ TURN Server for WebRTC (Fixes video connections behind NAT)
  coturn:
    image: coturn/coturn:latest
    container_name: hurshbintech-coturn
    restart: unless-stopped
    network_mode: "host"
    command: 
      - -n 
      - --log-file=stdout 
      - --min-port=49152 
      - --max-port=65535 
      - --realm=hurshbin.lumesoftai.in
      - --user=hurshbin:SecureTurnPass2024!
      - --lt-cred-mech 
      - --fingerprint 
      - --external-ip=43.204.218.16
      - --listening-port=3478