version: '3.8'

services:
  backend:
    build:
      context: ./hurshbintech-backend
      dockerfile: Dockerfile
    container_name: hurshbintech-backend
    ports:
      - "8000:8000"
    env_file:
      - ./hurshbintech-backend/.env.production
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hurshbintech-network

  frontend:
    build:
      context: ./hurshbintech-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
    container_name: hurshbintech-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hurshbintech-network

volumes:
  backend-uploads:
    driver: local

networks:
  hurshbintech-network:
    driver: bridge
