server {
    listen 3000 ssl;
    server_name localhost;

    # SSL certificates
    ssl_certificate /app/certs/cert.pem;
    ssl_certificate_key /app/certs/key.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ✅ Explicitly handle PWA Manifest with correct MIME type
    location /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        try_files $uri =404;
    }

    # ✅ UPDATED: S3 proxy for PWA (Domain + Port 3001)
    location ~ ^/s3/(.*)$ {
        resolver 8.8.8.8;
        proxy_pass https://hurshbintech-media-bucket.s3.ap-south-1.amazonaws.com/$1;
        proxy_ssl_verify off;

        # ✅ CHANGED: Allow the specific DOMAIN
        add_header 'Access-Control-Allow-Origin' 'https://hurshbin.lumesoftai.in:3001' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Max-Age' '3000' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            # ✅ CHANGED: Allow the specific DOMAIN
            add_header 'Access-Control-Allow-Origin' 'https://hurshbin.lumesoftai.in:3001' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host hurshbintech-media-bucket.s3.ap-south-1.amazonaws.com;
        proxy_set_header Authorization "";
        proxy_redirect off;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (local only, NOT S3)
    location ~* \.(js|css|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
