#to dynamically check the origin and set the appropriate CORS header
map $http_origin $cors_origin {
    default "https://hurshbin.com";
    "https://www.hurshbin.com" "https://www.hurshbin.com";
    "https://hurshbin.com" "https://hurshbin.com";
}

server {
    # Prod: Listen on standard HTTPS port 443 (no port needed in URL)
    listen 443 ssl;
    server_name hurshbin.com www.hurshbin.com;

    ssl_certificate /app/certs/cert.pem;
    ssl_certificate_key /app/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ CRITICAL: Allow large file uploads (500MB for videos)
    # Default is 1MB, which blocks all file uploads > 1MB with 413 error
    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    

    # PWA Manifest with correct MIME type
    location /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        try_files $uri =404;
    }

    # S3 proxy for Prod (Neev Cloud bucket - path-style access)
    location ~ ^/s3/(.*)$ {
        resolver 8.8.8.8;
        proxy_pass https://s3-api.neevcloud.com/Hurshbintech-bucket/$1;
        proxy_ssl_verify off;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Max-Age' '3000' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host s3-api.neevcloud.com;
        proxy_set_header Authorization "";
        proxy_redirect off;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Highly Specific Proxy for Chat WebSocket (must come BEFORE generic /api/)
    location /api/chat/ws {
        proxy_pass http://backend-pwa:8000/api/chat/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        
        # WebSocket-specific timeout settings (default is 60s which closes idle connections)
        proxy_read_timeout 3600s;    # Wait up to 1 hour for backend to send data
        proxy_send_timeout 3600s;    # Wait up to 1 hour to send data to backend
        
        # Keep underlying TCP connection alive with periodic keepalive packets
        proxy_socket_keepalive on;
        
        # Disable buffering for WebSockets (must be real-time)
        proxy_buffering off;
        proxy_cache off;
        
        # Prevent caching of WebSocket connections
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Proxy Session/Training WebSocket requests (must come BEFORE generic /api/)
    location /api/ws/ {
        proxy_pass http://backend-pwa:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        
        # WebSocket-specific timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Proxy API requests to backend service
    # NOTE: Without trailing URI, Nginx passes the full request path as-is
    location /api/ {
        proxy_pass http://backend-pwa:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        
        # ✅ Let backend handle CORS with wildcard headers
        # Backend (FastAPI) has: allow_headers=["*"] which covers all headers including pragma
        # Nginx should not intercept - just proxy through to backend
    }

    # Proxy Swagger UI Docs to Backend
    location /docs {
        proxy_pass http://backend-pwa:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the OpenAPI schema (Required for the docs page to actually load data)
    location /openapi.json {
        proxy_pass http://backend-pwa:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket requests to backend service
    location /ws/ {
        proxy_pass http://backend-pwa:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    # Cache static assets
    # CRITICAL PWA FIX: Never cache the Service Worker or Workbox files
    location ~* (sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }   

    # Cache other static assets
    location ~* \.(js|css|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
