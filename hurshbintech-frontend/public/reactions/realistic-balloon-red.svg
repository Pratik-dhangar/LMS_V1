<svg width="220" height="300" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main balloon gradient - Red -->
    <radialGradient id="balloonGradientRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe6e6"></stop>
      <stop offset="45%" stop-color="#ff5757"></stop>
      <stop offset="100%" stop-color="#d32f2f"></stop>
    </radialGradient>

    <!-- Highlight gradient -->
    <radialGradient id="highlightGradientRed" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Soft shadow -->
    <filter id="softShadowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"></feGaussianBlur>
      <feOffset dx="0" dy="6" result="offsetblur"></feOffset>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Balloon body -->
  <ellipse cx="110" cy="120" rx="80" ry="100" fill="url(#balloonGradientRed)" filter="url(#softShadowRed)"></ellipse>

  <!-- Glossy highlight -->
  <ellipse cx="80" cy="90" rx="30" ry="45" fill="url(#highlightGradientRed)"></ellipse>

  <!-- Balloon knot -->
  <path d="M102 215 C108 230, 112 230, 118 215 Z" fill="#b71c1c"></path>

  <!-- String -->
  <path d="M110 230
       C105 255, 115 270, 108 300" stroke="#9e9e9e" stroke-width="2" fill="none"></path>
</svg>
