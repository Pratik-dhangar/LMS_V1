# Redis Production Configuration for Docker Deployment
# 256MB Memory Limit with LRU Eviction

# ========== MEMORY MANAGEMENT ==========

# Maximum memory limit (256MB)
maxmemory 256mb

# Eviction policy when max memory is reached
# allkeys-lru: Evict any key using LRU algorithm (Least Recently Used)
# This is ideal for cache workloads - keeps most used items
maxmemory-policy allkeys-lru

# Number of samples for LRU algorithm (higher = more accurate but slower)
maxmemory-samples 5

# ========== PERSISTENCE ==========

# Disable RDB snapshots (cache doesn't need persistence)
# This prevents disk write errors from blocking Redis
save ""

# Disable AOF (Append Only File) for cache workload
appendonly no

# Don't block writes if background save fails
# Critical for preventing server crashes due to disk issues
stop-writes-on-bgsave-error no

# ========== NETWORKING ==========

# Bind to all interfaces (Docker requirement)
bind 0.0.0.0

# Protected mode off (Docker network is isolated)
protected-mode no

# Default Redis port
port 6379

# TCP backlog
tcp-backlog 511

# Close connection after client idle for N seconds (0 = disabled)
timeout 300

# TCP keepalive
tcp-keepalive 300

# ========== PERFORMANCE ==========

# Number of databases (we only use db 0)
databases 16

# Lazy freeing (delete in background thread)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ========== LOGGING ==========

# Log level: debug, verbose, notice, warning
loglevel notice

# Log to stdout (Docker will capture)
logfile ""

# ========== SECURITY ==========

# Password protection (set via environment variable for production)
requirepass Password12#$

# Rename dangerous commands (optional)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
rename-command CONFIG ""

# ========== LIMITS ==========

# Max number of connected clients
maxclients 10000

# ========== ADVANCED ==========

# Hash max ziplist entries/value (memory optimization)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression (saves memory)
list-max-ziplist-size -2
list-compress-depth 0

# Set max intset entries
set-max-intset-entries 512

# Sorted set max ziplist entries/value
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hz (affects background tasks frequency)
hz 10

# Enable active defragmentation (reduces memory fragmentation)
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 25
active-defrag-cycle-min 5
active-defrag-cycle-max 75
